<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<title>Zostaniesz moją Walentynką? ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        height: 100vh;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        font-family: 'Comic Sans MS', cursive, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        color: white;
        text-align: center;
    }

    .container {
        background: rgba(255, 255, 255, 0.15);
        padding: 40px;
        border-radius: 25px;
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.25);
        max-width: 400px;
        width: 90%;
    }

    h1 {
        font-size: 2.4rem;
        margin-bottom: 15px;
    }

    p {
        font-size: 1.2rem;
        margin-bottom: 30px;
    }

    .buttons {
        position: relative;
        height: 120px;
    }

    button {
        font-size: 1.1rem;
        padding: 12px 28px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    #yes {
        background: #ff2e63;
        color: white;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    #yes:hover {
        transform: scale(1.1);
    }

    #no {
        position: absolute;
        background: white;
        color: #ff2e63;
        left: 220px;
        top: 0;
    }

    .firework {
        position: fixed;
        width: 10px;
        height: 10px;
        background: transparent;
        border-radius: 50%;
        pointer-events: none;
        animation: explode 1.2s ease-out forwards;
    }

    @keyframes explode {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(4); opacity: 0; }
    }
</style>
</head>

<body>

<div class="container" id="content">
    <h1>💘 Hej Piękna!</h1>
    <p>Czy zostaniesz moją Walentynką? 🥰</p>

    <div class="buttons">
        <button id="yes">Tak ❤️</button>
        <button id="no">Nie 🙄</button>
    </div>
</div>

<script>
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const content = document.getElementById('content');

    // USTALONE pozycje – dzięki temu nie "lata"
    const positions = [
        { left: 220, top: 0 },
        { left: 0, top: 0 },
        { left: 110, top: 50 },
        { left: 180, top: 70 },
        { left: 30, top: 70 }
    ];

    let index = 0;

    noBtn.addEventListener('mouseenter', () => {
        index = (index + 1) % positions.length;
        noBtn.style.left = positions[index].left + 'px';
        noBtn.style.top = positions[index].top + 'px';
    });

    yesBtn.addEventListener('click', () => {
        content.innerHTML = `
            <h1>🎉 Wiedziałem! 💖</h1>
            <p>Jesteś najlepszą Walentynką na świecie 😘</p>
        `;
        launchFireworks();
    });

    function launchFireworks() {
        for (let i = 0; i < 40; i++) {
            const fw = document.createElement('div');
            fw.className = 'firework';
            fw.style.left = Math.random() * window.innerWidth + 'px';
            fw.style.top = Math.random() * window.innerHeight + 'px';
            fw.style.background = `hsl(${Math.random() * 360}, 100%, 70%)`;
            document.body.appendChild(fw);

            setTimeout(() => fw.remove(), 1200);
        }
    }
</script>

</body>
</html>
